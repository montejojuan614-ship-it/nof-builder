<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>NOF Builder</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      margin: 0;
      padding: 20px;
    }

    h1 {
      text-align: center;
    }

    .container {
      max-width: 900px;
      margin: auto;
    }

    .card {
      background: #1e293b;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 10px;
    }

    input, select {
      width: 100%;
      padding: 10px;
      margin-top: 8px;
      margin-bottom: 15px;
      border-radius: 6px;
      border: none;
    }

    button {
      background: #22c55e;
      color: white;
      padding: 15px;
      border: none;
      width: 100%;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #16a34a;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>NOF Builder</h1>

  <!-- TEMPLATE SELECTOR -->
  <div class="card">
    <label>Select Template</label>
    <select id="templateSelect">
      <option value="motion">Motion to Consolidate</option>
    </select>
  </div>

  <!-- RESPONDENT 1 -->
  <div class="card">
    <h2>Respondent 1 (Lead Case)</h2>

    <input id="r1_name" placeholder="Full Name">
    <input id="r1_anumber" placeholder="A-Number">

    <input id="r1_hearing_date" placeholder="Hearing Date">
    <input id="r1_hearing_time" placeholder="Hearing Time">
    <input id="r1_hearing_type" placeholder="Hearing Type">
  </div>

  <!-- RESPONDENT 2 -->
  <div class="card">
    <h2>Respondent 2</h2>

    <input id="r2_name" placeholder="Full Name">
    <input id="r2_anumber" placeholder="A-Number">

    <input id="r2_hearing_date" placeholder="Hearing Date">
    <input id="r2_hearing_time" placeholder="Hearing Time">
    <input id="r2_hearing_type" placeholder="Hearing Type">
  </div>

  <!-- RELATIONSHIP -->
  <div class="card">
    <h2>Relationship</h2>

    <select id="relationship">
      <option value="wife">Wife</option>
      <option value="husband">Husband</option>
      <option value="son">Son</option>
      <option value="daughter">Daughter</option>
    </select>
  </div>

  <!-- COURT -->
  <div class="card">
    <h2>Court Info</h2>

    <input id="court_city" placeholder="Court City">
    <input id="court_state" placeholder="Court State">
    <input id="judge_name" placeholder="Judge Name">
  </div>

  <!-- ATTORNEY -->
  <div class="card">
    <h2>Attorney Info</h2>

    <input id="attorney_name" placeholder="Attorney Name">
    <input id="law_firm" placeholder="Law Firm">
    <input id="email" placeholder="Email">
    <input id="phone" placeholder="Phone">
  </div>

  <!-- BUTTON -->
  <button onclick="generateDocument()">Generate Document</button>

</div>

<script>
function generateDocument() {

  const data = {
    r1_name: document.getElementById('r1_name').value,
    r1_anumber: document.getElementById('r1_anumber').value,
    r2_name: document.getElementById('r2_name').value,
    r2_anumber: document.getElementById('r2_anumber').value,
    relationship: document.getElementById('relationship').value,
    court_city: document.getElementById('court_city').value,
    court_state: document.getElementById('court_state').value,
    judge_name: document.getElementById('judge_name').value
  };

  console.log("DATA:", data);

  alert("Aquí conectamos con el generador de Word");

  // 🔥 AQUÍ luego conectamos tu sistema actual
}
</script>

</body>
</html>
